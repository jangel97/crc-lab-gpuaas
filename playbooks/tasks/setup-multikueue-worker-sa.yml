---
- name: Create multikueue-sa ServiceAccount on worker
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ multikueue_sa_name }}
        namespace: {{ multikueue_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"

- name: Create multikueue-worker ClusterRole
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: multikueue-worker
      rules:
      - apiGroups: ["kueue.x-k8s.io"]
        resources: ["workloads", "workloads/status"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["pods", "pods/status"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["get", "list", "watch", "create", "update", "patch"]
      - apiGroups: ["batch"]
        resources: ["jobs", "jobs/status"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"

- name: Bind multikueue-sa to ClusterRole
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: multikueue-worker
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: multikueue-worker
      subjects:
      - kind: ServiceAccount
        name: {{ multikueue_sa_name }}
        namespace: {{ multikueue_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"

- name: Create long-lived token for multikueue-sa
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ multikueue_sa_name }}-token
        namespace: {{ multikueue_namespace }}
        annotations:
          kubernetes.io/service-account.name: {{ multikueue_sa_name }}
      type: kubernetes.io/service-account-token
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"

- name: Wait for token to be populated
  shell: >
    oc get secret {{ multikueue_sa_name }}-token -n {{ multikueue_namespace }}
    -o jsonpath='{.data.token}'
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"
  register: sa_token_raw
  retries: 10
  delay: 5
  until: sa_token_raw.stdout | length > 0
  changed_when: false

- name: Get worker API server URL
  command: oc whoami --show-server
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"
  register: worker_api_url
  changed_when: false

- name: Get worker CA certificate
  shell: >
    oc get secret {{ multikueue_sa_name }}-token -n {{ multikueue_namespace }}
    -o jsonpath='{.data.ca\.crt}'
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"
  register: worker_ca_b64
  changed_when: false

- name: Build worker kubeconfig for MultiKueue
  set_fact:
    worker_multikueue_kubeconfig: |
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          certificate-authority-data: {{ worker_ca_b64.stdout }}
          server: {{ worker_api_url.stdout }}
        name: worker
      contexts:
      - context:
          cluster: worker
          user: {{ multikueue_sa_name }}
        name: worker
      current-context: worker
      users:
      - name: {{ multikueue_sa_name }}
        user:
          token: {{ sa_token_raw.stdout | b64decode }}
