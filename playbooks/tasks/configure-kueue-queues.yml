---
- name: "{{ target_cluster }} | Create gpu-flavor ResourceFlavor"
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: kueue.x-k8s.io/v1beta1
      kind: ResourceFlavor
      metadata:
        name: gpu-flavor
  environment:
    KUBECONFIG: "{{ target_kubeconfig }}"

- name: "{{ target_cluster }} | Create ClusterQueue"
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: kueue.x-k8s.io/v1beta1
      kind: ClusterQueue
      metadata:
        name: cluster-queue
      spec:
        namespaceSelector: {}
        resourceGroups:
        - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
          flavors:
          - name: gpu-flavor
            resources:
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: "20Gi"
            - name: "nvidia.com/gpu"
              nominalQuota: 1
  environment:
    KUBECONFIG: "{{ target_kubeconfig }}"
