---
- name: Write worker kubeconfig to temp file
  copy:
    content: "{{ worker_vk_kubeconfig }}"
    dest: /tmp/vk-worker-kubeconfig
    mode: "0600"

- name: Delete old worker-kubeconfig Secret on tenant (if exists)
  command: oc delete secret worker-kubeconfig -n kube-system --ignore-not-found
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"

- name: Create worker-kubeconfig Secret on tenant
  command: >
    oc create secret generic worker-kubeconfig
    -n kube-system
    --from-file=kubeconfig=/tmp/vk-worker-kubeconfig
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"

- name: Remove temp kubeconfig file
  file:
    path: /tmp/vk-worker-kubeconfig
    state: absent

- name: Apply VK RBAC on tenant
  command:
    cmd: oc apply -f -
    stdin: "{{ lookup('file', playbook_dir + '/../deploy/vk-rbac.yml') }}"
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"

- name: Apply VK Deployment on tenant
  command:
    cmd: oc apply -f -
    stdin: "{{ lookup('file', playbook_dir + '/../deploy/vk-deployment.yml') }}"
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"

- name: Wait for VK pod to be Ready
  command: >
    oc wait deployment -n kube-system vk-gpu-provider
    --for=condition=Available --timeout=120s
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"
  retries: 3
  delay: 10
  register: vk_ready
  until: vk_ready.rc == 0

- name: Wait for virtual node to appear
  shell: >
    oc get node {{ vk_node_name }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment:
    KUBECONFIG: "{{ tenant_kubeconfig | default(kubeconfig_dir + '/tenant') }}"
  register: vk_node_status
  retries: 12
  delay: 10
  until: vk_node_status.stdout == 'True'
  changed_when: false
