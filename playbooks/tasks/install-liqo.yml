---
- name: Check liqoctl is installed
  command: which liqoctl
  delegate_to: localhost
  register: liqoctl_check
  failed_when: false
  changed_when: false
  run_once: true

- name: Download liqoctl
  when: liqoctl_check.rc != 0
  get_url:
    url: "https://github.com/liqotech/liqo/releases/download/{{ liqo_version }}/liqoctl-linux-amd64.tar.gz"
    dest: "/tmp/liqoctl-{{ liqo_version }}.tar.gz"
  delegate_to: localhost
  run_once: true

- name: Extract liqoctl
  when: liqoctl_check.rc != 0
  unarchive:
    src: "/tmp/liqoctl-{{ liqo_version }}.tar.gz"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/"
    remote_src: true
    include: [liqoctl]
  delegate_to: localhost
  run_once: true

# Workaround: liqo-gateway-scc.yaml has a template bug that renders invalid
# labels (passes root context to liqo.selectorLabels which expects .name and
# .module). Pre-creating the SCC with Helm ownership annotations lets Helm
# adopt it instead of rendering the broken template.
# Upstream: https://github.com/liqotech/liqo/issues/3385
- name: "{{ inventory_hostname }} | Pre-create liqo-gateway SCC (workaround for template bug)"
  command: >
    oc apply -f - --kubeconfig {{ kubeconfig }}
  args:
    stdin: |
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      metadata:
        name: liqo-gateway
        labels:
          app.kubernetes.io/name: gateway
          app.kubernetes.io/part-of: liqo
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: liqo
          meta.helm.sh/release-namespace: liqo
      allowHostDirVolumePlugin: false
      allowHostIPC: false
      allowHostNetwork: true
      allowHostPID: false
      allowHostPorts: true
      allowPrivilegedContainer: true
      allowPrivilegeEscalation: true
      allowedCapabilities:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      defaultAddCapabilities: null
      fsGroup:
        type: RunAsAny
      groups: []
      readOnlyRootFilesystem: false
      requiredDropCapabilities: null
      runAsUser:
        type: RunAsAny
      seLinuxContext:
        type: RunAsAny
      supplementalGroups:
        type: RunAsAny
      volumes:
        - '*'
      users:
        - system:serviceaccount:liqo:liqo-gateway
  register: scc_gw_result
  changed_when: "'created' in scc_gw_result.stdout"

# The broken liqo-gateway-scc.yaml template also prevents liqo-fabric SCC from
# being created (Helm stops applying resources after the gateway SCC fails).
- name: "{{ inventory_hostname }} | Pre-create liqo-fabric SCC"
  command: >
    oc apply -f - --kubeconfig {{ kubeconfig }}
  args:
    stdin: |
      apiVersion: security.openshift.io/v1
      kind: SecurityContextConstraints
      metadata:
        name: liqo-fabric
        labels:
          app.kubernetes.io/name: fabric
          app.kubernetes.io/component: networking
          app.kubernetes.io/part-of: liqo
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: liqo
          meta.helm.sh/release-namespace: liqo
      allowHostDirVolumePlugin: false
      allowHostIPC: false
      allowHostNetwork: true
      allowHostPID: false
      allowHostPorts: true
      allowPrivilegedContainer: true
      allowPrivilegeEscalation: true
      allowedCapabilities:
        - NET_ADMIN
        - NET_RAW
      defaultAddCapabilities: null
      fsGroup:
        type: RunAsAny
      readOnlyRootFilesystem: false
      runAsUser:
        type: RunAsAny
      seLinuxContext:
        type: RunAsAny
      supplementalGroups:
        type: RunAsAny
      volumes:
        - '*'
      users:
        - system:serviceaccount:liqo:liqo-fabric
  register: scc_fabric_result
  changed_when: "'created' in scc_fabric_result.stdout"

# Workaround: EnforceAPIServerProxyIPRemapping runs unconditionally at
# controller-manager startup, even with proxy.enabled=false. Without a
# proxy service, the controller crashes. A dummy service satisfies the check.
- name: "{{ inventory_hostname }} | Create liqo namespace"
  command: >
    oc create namespace liqo --kubeconfig {{ kubeconfig }}
  register: ns_result
  failed_when: ns_result.rc != 0 and 'already exists' not in (ns_result.stderr | default(''))
  changed_when: ns_result.rc == 0

- name: "{{ inventory_hostname }} | Create dummy proxy service (workaround for proxy.enabled=false bug)"
  command: >
    oc apply -f - --kubeconfig {{ kubeconfig }}
  args:
    stdin: |
      apiVersion: v1
      kind: Service
      metadata:
        name: liqo-proxy
        namespace: liqo
        labels:
          app.kubernetes.io/name: proxy
          app.kubernetes.io/part-of: liqo
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: liqo
          meta.helm.sh/release-namespace: liqo
      spec:
        type: ClusterIP
        ports:
          - port: 8118
            targetPort: 8118
            protocol: TCP
        selector:
          app.kubernetes.io/name: proxy-dummy-no-endpoints
  register: proxy_svc_result
  changed_when: "'created' in proxy_svc_result.stdout"

- name: Install Liqo on this cluster
  command: >
    liqoctl install openshift
    --cluster-id {{ inventory_hostname }}
    --version {{ liqo_version }}
    --set proxy.enabled=false
    --set offloading.reflection.configmap.type=DenyList
    --set offloading.reflection.secret.type=DenyList
    --set offloading.reflection.service.type=DenyList
    --set offloading.reflection.endpointslice.type=DenyList
    --timeout 10m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    PATH: "{{ local_bin }}:{{ lookup('env', 'PATH') }}"

- name: Wait for Liqo deployments
  shell: >
    oc wait deploy -n liqo --all --for=condition=Available --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    PATH: "{{ local_bin }}:{{ lookup('env', 'PATH') }}"
  retries: 3
  delay: 30
  register: liqo_wait
  until: liqo_wait.rc == 0

# Workaround: Configuration CRD is missing status.conditions and
# status.observedGeneration in its schema. The controller tries to set them
# but OCP API server strips unknown fields, causing liqoctl peer to wait
# forever for "configuration to be applied".
- name: "{{ inventory_hostname }} | Patch Configuration CRD status schema"
  command: >
    oc patch crd configurations.networking.liqo.io --type=json
    --kubeconfig {{ kubeconfig }}
    -p '[
      {"op":"add","path":"/spec/versions/0/schema/openAPIV3Schema/properties/status/properties/conditions","value":{"type":"array","items":{"type":"object","required":["type","status"],"properties":{"type":{"type":"string"},"status":{"type":"string"},"reason":{"type":"string"},"message":{"type":"string"},"lastTransitionTime":{"type":"string","format":"date-time"},"observedGeneration":{"type":"integer","format":"int64"}}}}},
      {"op":"add","path":"/spec/versions/0/schema/openAPIV3Schema/properties/status/properties/observedGeneration","value":{"type":"integer","format":"int64"}}
    ]'
  register: crd_patch
  changed_when: "'patched' in crd_patch.stdout"
  failed_when: crd_patch.rc != 0 and 'already exists' not in (crd_patch.stderr | default(''))

# Workaround: liqoctl install openshift sets --enable-api-server-ip-remapping=false,
# but the VK's pod reflector (--enable-apiserver-support=true) requires the
# api-server IP resource to exist. Without it, pod reflection fails with
# 'ips.ipam.liqo.io "api-server" not found'.
- name: "{{ inventory_hostname }} | Enable API server IP remapping"
  shell: >
    oc get deploy liqo-controller-manager -n liqo
    --kubeconfig {{ kubeconfig }}
    -o jsonpath='{.spec.template.spec.containers[0].args}'
    | python3 -c '
    import sys, json
    args = json.load(sys.stdin)
    idx = next((i for i, a in enumerate(args) if a.startswith("--enable-api-server-ip-remapping=")), None)
    if idx is not None and args[idx] == "--enable-api-server-ip-remapping=false":
      print(idx)
    else:
      print("skip")
    '
  register: remap_idx
  changed_when: false

- name: "{{ inventory_hostname }} | Patch CM to enable API server IP remapping"
  when: remap_idx.stdout | trim != "skip"
  command: >
    oc patch deploy liqo-controller-manager -n liqo
    --kubeconfig {{ kubeconfig }}
    --type=json
    -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args/{{ remap_idx.stdout | trim }}","value":"--enable-api-server-ip-remapping=true"}]'

- name: Report Liqo installed
  debug:
    msg: "Liqo installed on {{ inventory_hostname }} (role: {{ components.liqo }}, proxy: disabled)"
