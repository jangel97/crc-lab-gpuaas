---
- name: Check if RHOAI operator is installed
  command: oc get deployment -n redhat-ods-operator rhods-operator
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: rhoai_check
  failed_when: false
  changed_when: false

- name: Install RHOAI operator subscription
  when: rhoai_check.rc != 0
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: redhat-ods-operator
      ---
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: rhods-operator
        namespace: redhat-ods-operator
      ---
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: rhods-operator
        namespace: redhat-ods-operator
      spec:
        channel: stable
        name: rhods-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Wait for RHOAI operator
  command: oc wait deployment -n redhat-ods-operator rhods-operator --for=condition=Available --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  retries: 3
  delay: 30
  register: rhoai_wait
  until: rhoai_wait.rc == 0

- name: Create DSCInitialization and DataScienceCluster
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: dscinitialization.opendatahub.io/v1
      kind: DSCInitialization
      metadata:
        name: default-dsci
      spec:
        applicationsNamespace: redhat-ods-applications
      ---
      apiVersion: datasciencecluster.opendatahub.io/v1
      kind: DataScienceCluster
      metadata:
        name: default-dsc
      spec:
        components:
          trainingoperator:
            managementState: Managed
          ray:
            managementState: Managed
          kserve:
            managementState: Managed
            serving:
              managementState: Managed
          dashboard:
            managementState: Managed
          workbenches:
            managementState: Managed
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Wait for training operator deployment
  command: >
    oc wait deployment -n redhat-ods-applications
    kubeflow-training-operator
    --for=condition=Available --timeout=600s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  retries: 3
  delay: 30
  register: training_op_wait
  until: training_op_wait.rc == 0
  failed_when: false

- name: Report RHOAI status
  debug:
    msg: "RHOAI installed on {{ inventory_hostname }} with training operator, Ray, KServe, dashboard, workbenches"
