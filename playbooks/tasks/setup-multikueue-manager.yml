---
- name: Store worker kubeconfig as Secret on tenant
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: worker-kubeconfig
        namespace: {{ multikueue_namespace }}
      type: Opaque
      stringData:
        kubeconfig: |
          {{ worker_multikueue_kubeconfig | indent(6) }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

- name: Create AdmissionCheck for MultiKueue
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: kueue.x-k8s.io/v1beta1
      kind: AdmissionCheck
      metadata:
        name: multikueue
      spec:
        controllerName: kueue.x-k8s.io/multikueue
        parameters:
          apiGroup: kueue.x-k8s.io
          kind: MultiKueueConfig
          name: multikueue-config
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

- name: Create MultiKueueConfig
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: kueue.x-k8s.io/v1beta1
      kind: MultiKueueConfig
      metadata:
        name: multikueue-config
      spec:
        clusters:
        - name: worker-cluster
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

- name: Create MultiKueueCluster pointing to worker
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: kueue.x-k8s.io/v1beta1
      kind: MultiKueueCluster
      metadata:
        name: worker-cluster
      spec:
        kubeConfig:
          locationType: Secret
          location: worker-kubeconfig
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

- name: Patch ClusterQueue to add AdmissionCheck
  command: >
    oc patch clusterqueue cluster-queue --type merge
    -p '{"spec":{"admissionChecks":["multikueue"]}}'
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"
  register: cq_patch
  changed_when: "'patched' in cq_patch.stdout"
