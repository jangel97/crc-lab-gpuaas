---
# Broker lives on the GPU (worker) cluster — it's long-lived,
# tied to physical hardware. Control clusters get rebuilt.

- name: Deploy Submariner broker on GPU cluster
  command: >
    subctl deploy-broker
    --kubeconfig {{ kubeconfig_dir }}/worker
  args:
    chdir: "{{ work_dir }}"
  register: broker_deploy
  changed_when: "'Deploying the broker' in broker_deploy.stdout"

- name: Join GPU cluster to broker
  command: >
    subctl join
    --kubeconfig {{ kubeconfig_dir }}/worker
    {{ work_dir }}/broker-info.subm
    --clusterid gpu
    --natt=false
    --cable-driver libreswan
  register: gpu_join
  changed_when: "'Deploying submariner' in gpu_join.stdout"

- name: Join control cluster to broker
  command: >
    subctl join
    --kubeconfig {{ kubeconfig_dir }}/tenant
    {{ work_dir }}/broker-info.subm
    --clusterid control
    --natt=false
    --cable-driver libreswan
  register: control_join
  changed_when: "'Deploying submariner' in control_join.stdout"

- name: Wait for Submariner tunnel to connect
  shell: >
    subctl show connections --kubeconfig {{ kubeconfig_dir }}/tenant 2>&1
  register: sub_conn
  retries: 12
  delay: 10
  until: "'connected' in sub_conn.stdout"
  changed_when: false

- name: Print connection status
  debug:
    msg: "{{ sub_conn.stdout }}"

# Verify cross-cluster pod connectivity
- name: Create verification pod on worker
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: submariner-verify
        namespace: {{ vk_worker_namespace }}
      spec:
        containers:
        - name: nginx
          image: docker.io/library/nginx:latest
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"

- name: Create verification pod on tenant
  command:
    cmd: oc apply -f -
    stdin: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: submariner-verify
        namespace: {{ vk_test_namespace }}
      spec:
        containers:
        - name: nginx
          image: docker.io/library/nginx:latest
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

- name: Wait for verification pods to be ready
  shell: >
    oc wait pod/submariner-verify -n {{ item.ns }}
    --for=condition=Ready --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/{{ item.cluster }}"
  loop:
    - { cluster: worker, ns: "{{ vk_worker_namespace }}" }
    - { cluster: tenant, ns: "{{ vk_test_namespace }}" }

- name: Get verification pod IPs
  shell: >
    oc get pod submariner-verify -n {{ item.ns }}
    -o jsonpath='{.status.podIP}'
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/{{ item.cluster }}"
  register: verify_ips
  loop:
    - { cluster: worker, ns: "{{ vk_worker_namespace }}" }
    - { cluster: tenant, ns: "{{ vk_test_namespace }}" }
  changed_when: false

- name: Test cross-cluster connectivity (tenant → worker)
  shell: >
    oc exec -n {{ vk_test_namespace }} submariner-verify --
    curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10
    http://{{ verify_ips.results[0].stdout }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/tenant"
  register: conn_test_fwd
  retries: 3
  delay: 5
  until: conn_test_fwd.stdout == '200'
  changed_when: false

- name: Test cross-cluster connectivity (worker → tenant)
  shell: >
    oc exec -n {{ vk_worker_namespace }} submariner-verify --
    curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10
    http://{{ verify_ips.results[1].stdout }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/worker"
  register: conn_test_rev
  retries: 3
  delay: 5
  until: conn_test_rev.stdout == '200'
  changed_when: false

- name: Delete verification pods
  command: >
    oc delete pod submariner-verify -n {{ item.ns }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/{{ item.cluster }}"
  loop:
    - { cluster: worker, ns: "{{ vk_worker_namespace }}" }
    - { cluster: tenant, ns: "{{ vk_test_namespace }}" }

- name: Print verification result
  debug:
    msg: |
      Submariner cross-cluster connectivity verified.
      Tenant → Worker: HTTP {{ conn_test_fwd.stdout }}
      Worker → Tenant: HTTP {{ conn_test_rev.stdout }}
