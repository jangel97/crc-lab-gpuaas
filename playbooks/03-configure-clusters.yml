---
- name: Discover cluster endpoints
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
  - name: Discover each cluster
    include_tasks: tasks/discover-cluster.yml
    loop: "{{ groups['clusters'] }}"
    loop_control:
      loop_var: cluster
    vars:
      c: "{{ hostvars[cluster] }}"

- name: Configure clusters based on components
  hosts: clusters
  connection: local
  gather_facts: false
  environment:
    PATH: "{{ local_bin }}:{{ lookup('env', 'PATH') }}"

  tasks:
  # Free up resources by disabling non-essential components
  - name: Slim down cluster
    include_tasks: tasks/slim-down-cluster.yml

  # GPU Operator (worker only)
  - name: Install GPU Operator
    include_tasks: tasks/install-gpu-operator.yml
    when: components.gpu_operator | default(false) | bool

  # Kueue (worker only)
  - name: Install Kueue
    include_tasks: tasks/install-kueue.yml
    when: components.kueue | default(false) | bool

  # LVMS (tenant only, provides StorageClass for PVCs)
  - name: Install LVMS
    include_tasks: tasks/install-lvms.yml
    when: components.lvms | default(false) | bool

  # Liqo (both, role-aware)
  - name: Install Liqo
    include_tasks: tasks/install-liqo.yml
    when: components.liqo is defined

  # RHOAI (tenant only)
  - name: Install RHOAI
    include_tasks: tasks/install-rhoai.yml
    when: components.rhoai | default(false) | bool

  # Disable default catalog sources after all operators are installed (~300-600MB saved)
  - name: Disable OperatorHub default catalog sources
    command: >
      oc patch operatorhub.config.openshift.io/cluster --type merge
      -p '{"spec":{"disableAllDefaultSources":true}}'
      --kubeconfig {{ kubeconfig }}
    register: catalogsource_result
    changed_when: "'patched' in catalogsource_result.stdout"
