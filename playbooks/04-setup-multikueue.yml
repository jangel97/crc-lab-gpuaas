---
- name: Set up MultiKueue federation
  hosts: localhost
  connection: local
  gather_facts: true

  environment:
    PATH: "{{ local_bin }}:{{ lookup('env', 'PATH') }}"

  tasks:
  # Step 1: Configure Kueue queues on both clusters
  - name: Configure Kueue queues on worker
    include_tasks: tasks/configure-kueue-queues.yml
    vars:
      target_cluster: worker
      target_kubeconfig: "{{ kubeconfig_dir }}/worker"

  - name: Configure Kueue queues on tenant (manager)
    include_tasks: tasks/configure-kueue-queues.yml
    vars:
      target_cluster: tenant
      target_kubeconfig: "{{ kubeconfig_dir }}/tenant"

  # Step 2: Create MultiKueue service account on worker
  - name: Set up MultiKueue worker service account
    include_tasks: tasks/setup-multikueue-worker-sa.yml

  # Step 3: Create MultiKueue resources on tenant (manager)
  - name: Set up MultiKueue manager resources
    include_tasks: tasks/setup-multikueue-manager.yml

  # Step 4: Create matching test namespace on both clusters
  - name: Create test namespace on tenant
    command: >
      oc create namespace {{ multikueue_test_namespace }}
      --kubeconfig {{ kubeconfig_dir }}/tenant
    register: ns_tenant
    failed_when: ns_tenant.rc != 0 and 'already exists' not in (ns_tenant.stderr | default(''))
    changed_when: ns_tenant.rc == 0

  - name: Create test namespace on worker
    command: >
      oc create namespace {{ multikueue_test_namespace }}
      --kubeconfig {{ kubeconfig_dir }}/worker
    register: ns_worker
    failed_when: ns_worker.rc != 0 and 'already exists' not in (ns_worker.stderr | default(''))
    changed_when: ns_worker.rc == 0

  # Step 5: Create LocalQueue in test namespace on both clusters
  - name: Create LocalQueue on tenant
    command:
      cmd: oc apply -f -
      stdin: |
        apiVersion: kueue.x-k8s.io/v1beta1
        kind: LocalQueue
        metadata:
          name: user-queue
          namespace: {{ multikueue_test_namespace }}
        spec:
          clusterQueue: cluster-queue
    environment:
      KUBECONFIG: "{{ kubeconfig_dir }}/tenant"

  - name: Create LocalQueue on worker
    command:
      cmd: oc apply -f -
      stdin: |
        apiVersion: kueue.x-k8s.io/v1beta1
        kind: LocalQueue
        metadata:
          name: user-queue
          namespace: {{ multikueue_test_namespace }}
        spec:
          clusterQueue: cluster-queue
    environment:
      KUBECONFIG: "{{ kubeconfig_dir }}/worker"

  # Step 6: Verify MultiKueue connectivity
  - name: Check MultiKueueCluster status
    shell: >
      oc get multikueueclusters.kueue.x-k8s.io worker-cluster
      -o jsonpath='{.status.conditions[?(@.type=="Active")].status}'
    environment:
      KUBECONFIG: "{{ kubeconfig_dir }}/tenant"
    register: mkc_status
    retries: 12
    delay: 10
    until: mkc_status.stdout == 'True'
    changed_when: false

  - name: Print MultiKueue status
    debug:
      msg: |
        MultiKueue federation established.
        Worker cluster status: Active={{ mkc_status.stdout }}
        Test namespace: {{ multikueue_test_namespace }}
        LocalQueue: user-queue
