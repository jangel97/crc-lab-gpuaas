# Kueue resources for multi-tenant GPU sharing with priority preemption.
#
# Replaces worker-kueue-queues.yml when testing cross-tenant preemption.
# Key difference: preemption.withinClusterQueue=LowerPriority allows Kueue to
# preempt lower-priority workloads when higher-priority ones arrive and quota
# is exhausted.
#
# LocalQueues are NOT included here because VK creates per-tenant worker
# namespaces dynamically (vk-{random}-{tenantNS}). Create a LocalQueue named
# "default" in each VK worker namespace — Kyverno's mutate-queue-name policy
# forces all pods to use the "default" queue.
#
# Prerequisites:
#   - Kueue v0.10+ installed on worker cluster
#   - Kyverno v1.14+ installed with policies from kueue-gpu-policy repo
#   - WorkloadPriorityClasses created (workload-priority-classes.yaml)
#   - Kueue MutatingWebhookConfiguration patched with reinvocationPolicy: IfNeeded
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: gpu-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue
spec:
  namespaceSelector: {}
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources: [cpu, memory, nvidia.com/gpu]
    flavors:
    - name: gpu-flavor
      resources:
      - name: cpu
        nominalQuota: 8
      - name: memory
        nominalQuota: 20Gi
      - name: nvidia.com/gpu
        nominalQuota: 1
