[project]
name = "crc-lab-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "kubernetes>=29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]
markers = [
    "vk: Virtual Kubelet cross-cluster GPU dispatch tests",
]
